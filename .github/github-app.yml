# Project configuration for the GitHub Copilot desktop app.
#
# The app reads this file from the default branch and uses it to fill in the
# Setup and Run buttons for every workspace it creates. Without it the app has
# no idea how to prepare a checkout, and a fresh worktree of this repo cannot
# run at all: `node_modules/` and `dist/` are both gitignored, so a brand new
# worktree has neither.
#
# Both commands are `node scripts/...` rather than `npm install && npm run build`
# on purpose. The app launches scripts with `cmd.exe /C` on Windows and `sh -c`
# elsewhere, and the two disagree about `&&`, quoting and `$VAR` / `%VAR%`, so
# anything with shell syntax in it works on exactly one of the two platforms.
# Node is the one interpreter this repo is guaranteed to have — it is the
# runtime — so the launchers make those decisions in JavaScript instead.
#
# Editing this file does not take effect until it is on the default branch and
# the app has been told to trust it (Settings -> Project -> repository config).
# Until then the app falls back to the per-project settings in its own store.
scripts:
  # Run once when the app creates a workspace, before anything else: installs
  # dependencies and builds every workspace package. Incremental and safe to
  # re-run.
  - name: setup
    command: node scripts/app-setup.mjs
    triggers:
      - session.create

  # The Run button. In a real terminal this is the interactive shell; under the
  # app's log pane, where nothing can be typed, it drives the same shell from a
  # canned transcript against the built-in demo data, so the log shows the tool
  # actually working rather than a prompt nobody can answer.
  - name: run
    command: node scripts/app-run.mjs

# There is no web UI and no server: this is a terminal program, and the Run
# script exits when its session ends. Nothing to open, and no readiness banner
# to wait for, so `server_ready_pattern` is deliberately left unset.
auto_open_in_browser: false

instructions: |
  Node 20.11+, npm workspaces, TypeScript project references.

  - Set up a fresh checkout with `npm run setup` (install + build). `node_modules/`
    and `dist/` are gitignored, so neither survives into a new worktree.
  - `npm run build` compiles; `npm test` builds and then runs the suite.
  - `npm start` is the shell; `demo` inside it mounts sample data, so no
    credentials or network are needed to exercise anything.
  - Tests are compiled first and run from `dist`, so run `npm test` rather than
    pointing a runner at the TypeScript sources.
